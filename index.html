<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="مخطط أسابيع ذكي بمهام ومستخدمين محليين، قابل للنشر على GitHub Pages.">
    <meta name="theme-color" content="#f6fafd">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Week Planner">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">
    <title>مخطط الأسابيع الذكي</title>
    <script>
        // Apply the last used theme/language before first paint so nothing flashes
        (function () {
            try {
                var pref = JSON.parse(localStorage.getItem("weeklyPlanner.prefs") || "null") || {};
                var dark = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
                var theme = pref.theme || (dark ? "dark" : "light");
                var root = document.documentElement;
                root.setAttribute("data-theme", theme);
                if (pref.lang === "en") { root.lang = "en"; root.dir = "ltr"; }
                var meta = document.querySelector('meta[name="theme-color"]');
                if (meta) meta.setAttribute("content", theme === "dark" ? "#030913" : "#f6fafd");
            } catch (e) {}
        })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
    <style>
        :root {
            color-scheme: light;
            --page: #f6fafd;
            --surface: #ffffff;
            --surface-soft: #eef6fb;
            --surface-strong: #b3cfe5;
            --surface-glass: rgba(246, 250, 253, 0.9);
            --ink: #0a1931;
            --ink-soft: #1a3d63;
            --muted: #4a7fa7;
            --line: #b3cfe5;
            --primary: #1a3d63;
            --primary-strong: #0a1931;
            --primary-soft: #ddeef8;
            --accent: #4a7fa7;
            --accent-soft: #eaf4fb;
            --success: #4a7fa7;
            --warning: #1a3d63;
            --danger: #0a1931;
            --archived: #1a3d63;
            --wash-a: rgba(10, 25, 49, 0.12);
            --wash-b: rgba(74, 127, 167, 0.28);
            --wash-c: rgba(179, 207, 229, 0.46);
            --shadow: 0 26px 80px rgba(10, 25, 49, 0.18);
            --radius: 8px;
        }

        [data-theme="dark"] {
            color-scheme: dark;
            --page: #030913;
            --surface: #071426;
            --surface-soft: #0a1931;
            --surface-strong: #1a3d63;
            --surface-glass: rgba(7, 20, 38, 0.9);
            --ink: #f6fafd;
            --ink-soft: #b3cfe5;
            --muted: #b3cfe5;
            --line: #234769;
            --primary: #b3cfe5;
            --primary-strong: #f6fafd;
            --primary-soft: #102b4b;
            --accent: #4a7fa7;
            --accent-soft: #0e2440;
            --success: #b3cfe5;
            --warning: #b3cfe5;
            --danger: #f6fafd;
            --archived: #050d19;
            --wash-a: rgba(10, 25, 49, 0.88);
            --wash-b: rgba(26, 61, 99, 0.58);
            --wash-c: rgba(74, 127, 167, 0.18);
            --shadow: 0 32px 90px rgba(0, 0, 0, 0.42);
        }

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            margin: 0;
            background:
                linear-gradient(118deg, var(--wash-a), transparent 38%),
                linear-gradient(226deg, var(--wash-b), transparent 40%),
                linear-gradient(180deg, var(--wash-c), transparent 56%),
                repeating-linear-gradient(145deg, transparent 0 18px, color-mix(in srgb, var(--line) 14%, transparent) 18px 19px),
                var(--page);
            background-attachment: fixed;
            color: var(--ink);
            font-family: "Segoe UI", Tahoma, Arial, sans-serif;
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
        }

        button {
            color: inherit;
        }

        .app-shell {
            width: min(1420px, calc(100% - 28px));
            margin: 22px auto 38px;
        }

        .app-frame {
            position: relative;
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: var(--surface-glass);
            box-shadow: var(--shadow);
            backdrop-filter: blur(18px);
        }

        .app-frame::before {
            content: "";
            display: block;
            height: 7px;
            background: linear-gradient(90deg, #0a1931 0 20%, #1a3d63 20% 40%, #4a7fa7 40% 62%, #b3cfe5 62% 82%, #f6fafd 82% 100%);
        }

        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            padding: 28px 24px 24px;
            border-bottom: 1px solid var(--line);
            background:
                linear-gradient(100deg, color-mix(in srgb, var(--primary-soft) 78%, transparent), transparent 58%),
                linear-gradient(260deg, color-mix(in srgb, var(--surface-strong) 30%, transparent), transparent 44%),
                var(--surface);
        }

        .brand {
            position: relative;
            display: grid;
            gap: 8px;
            padding-inline-start: 18px;
        }

        .brand::before {
            content: "";
            position: absolute;
            inset-block: 4px;
            inset-inline-start: 0;
            width: 6px;
            border-radius: 999px;
            background: linear-gradient(180deg, #0a1931, #1a3d63 34%, #4a7fa7 68%, #b3cfe5);
        }

        .date-line {
            color: var(--primary-strong);
            font-size: 14px;
            font-weight: 800;
        }

        h1,
        h2,
        h3,
        p {
            margin: 0;
        }

        h1 {
            font-size: 42px;
            line-height: 1.05;
            letter-spacing: 0;
            color: var(--primary-strong);
        }

        .subtitle {
            max-width: 760px;
            color: var(--muted);
            font-size: 16px;
            line-height: 1.8;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sync-pill {
            min-height: 42px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 0 12px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: color-mix(in srgb, var(--surface) 84%, var(--surface-soft));
            color: var(--muted);
            font-size: 13px;
            font-weight: 800;
            white-space: nowrap;
            cursor: default;
        }

        .sync-pill::before {
            content: "";
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--accent);
        }

        .sync-pill[data-state="synced"]::before { background: #2e9e6b; }
        .sync-pill[data-state="syncing"]::before { background: var(--accent); animation: syncPulse 1s ease-in-out infinite; }
        .sync-pill[data-state="pending"]::before { background: #d9a21b; }
        .sync-pill[data-state="offline"]::before,
        .sync-pill[data-state="error"]::before { background: #d4483b; }
        .sync-pill[data-state="error"] { cursor: pointer; }

        @keyframes syncPulse {
            50% { opacity: 0.3; }
        }

        .user-chip {
            min-height: 42px;
            display: inline-flex;
            align-items: center;
            gap: 9px;
            padding: 0 12px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: color-mix(in srgb, var(--surface) 84%, var(--surface-soft));
            color: var(--ink);
            cursor: pointer;
            font-weight: 900;
        }

        .user-chip:hover {
            border-color: var(--primary);
            background: var(--primary-soft);
        }

        .avatar {
            width: 26px;
            height: 26px;
            display: inline-grid;
            place-items: center;
            border-radius: 50%;
            background: linear-gradient(145deg, #0a1931, #1a3d63 58%, #4a7fa7);
            color: var(--surface);
            font-size: 13px;
            font-weight: 950;
        }

        .icon-button,
        .text-button {
            min-height: 42px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: color-mix(in srgb, var(--surface) 86%, var(--surface-soft));
            cursor: pointer;
            transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
        }

        .icon-button {
            width: 42px;
            display: inline-grid;
            place-items: center;
            font-size: 20px;
            line-height: 1;
        }

        .text-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 0 14px;
            font-weight: 800;
        }

        .text-button.primary {
            border-color: var(--primary);
            background: linear-gradient(135deg, #0a1931, #1a3d63 58%, #4a7fa7);
            color: #ffffff;
            box-shadow: 0 10px 24px rgba(10, 25, 49, 0.16);
        }

        .icon-button:hover,
        .text-button:hover {
            transform: translateY(-1px);
            border-color: var(--primary);
            background: var(--primary-soft);
            box-shadow: 0 10px 20px color-mix(in srgb, var(--primary) 12%, transparent);
        }

        .text-button.primary:hover {
            background: var(--primary-strong);
            color: #ffffff;
        }

        .control-band {
            display: grid;
            grid-template-columns: minmax(180px, 240px) auto minmax(240px, 1fr) minmax(170px, 210px);
            gap: 12px;
            padding: 18px 24px;
            border-bottom: 1px solid var(--line);
            background:
                linear-gradient(90deg, color-mix(in srgb, var(--surface-soft) 82%, transparent), transparent),
                var(--surface-soft);
        }

        .field,
        .search-field {
            display: grid;
            gap: 7px;
        }

        label,
        .field-label {
            color: var(--muted);
            font-size: 13px;
            font-weight: 800;
        }

        select,
        input,
        textarea {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: color-mix(in srgb, var(--surface) 90%, var(--surface-soft));
            color: var(--ink);
            outline: none;
            transition: border-color 0.18s ease, box-shadow 0.18s ease;
        }

        select,
        input {
            height: 44px;
            padding: 0 12px;
        }

        textarea {
            min-height: 118px;
            resize: vertical;
            padding: 12px;
            line-height: 1.7;
        }

        select:focus,
        input:focus,
        textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 20%, transparent);
        }

        #year-select[data-status="past"] {
            border-color: var(--archived);
            background: var(--archived);
            color: #ffffff;
        }

        #year-select[data-status="current"] {
            border-color: var(--primary);
            background: var(--primary-soft);
            color: var(--primary-strong);
        }

        #year-select[data-status="future"] {
            border-color: color-mix(in srgb, var(--accent) 55%, var(--line));
            background: var(--accent-soft);
            color: var(--warning);
        }

        .search-field {
            position: relative;
        }

        .search-field input {
            padding-inline-start: 44px;
        }

        .search-icon {
            position: absolute;
            inset-inline-start: 14px;
            bottom: 11px;
            color: var(--muted);
            font-size: 18px;
        }

        .insights {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
            padding: 18px 24px;
            border-bottom: 1px solid var(--line);
            background: color-mix(in srgb, var(--surface) 92%, var(--surface-soft));
        }

        .metric {
            min-width: 0;
            padding: 16px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background:
                linear-gradient(145deg, color-mix(in srgb, var(--surface) 82%, transparent), transparent),
                var(--surface-soft);
            box-shadow: inset 0 1px 0 color-mix(in srgb, #ffffff 55%, transparent);
        }

        .metric span {
            display: block;
            color: var(--muted);
            font-size: 13px;
            font-weight: 800;
        }

        .metric strong {
            display: block;
            margin-top: 6px;
            font-size: 28px;
            line-height: 1;
            color: var(--primary-strong);
        }

        .progress-track {
            height: 9px;
            margin-top: 12px;
            overflow: hidden;
            border-radius: 999px;
            background: var(--surface-strong);
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, #0a1931, #1a3d63, #4a7fa7, #b3cfe5);
            transition: width 0.25s ease;
        }

        .timeline {
            padding: 20px 24px 16px;
            border-bottom: 1px solid var(--line);
            background:
                linear-gradient(180deg, var(--surface), color-mix(in srgb, var(--surface-soft) 58%, var(--surface)));
        }

        .timeline-head {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 14px;
            margin-bottom: 14px;
        }

        .week-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
            font-size: 24px;
        }

        .week-range {
            color: var(--muted);
            font-size: 14px;
            font-weight: 700;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 34px;
            padding: 0 12px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: var(--surface-soft);
            color: var(--muted);
            font-size: 13px;
            font-weight: 900;
            white-space: nowrap;
        }

        .status-pill.past {
            border-color: transparent;
            background: linear-gradient(135deg, #0a1931, #1a3d63);
            color: #ffffff;
        }

        .status-pill.current {
            border-color: var(--primary);
            background: var(--primary-soft);
            color: var(--primary-strong);
        }

        .status-pill.future {
            border-color: color-mix(in srgb, var(--accent) 55%, var(--line));
            background: var(--accent-soft);
            color: var(--warning);
        }

        .week-strip {
            display: grid;
            grid-auto-flow: column;
            grid-auto-columns: minmax(118px, 132px);
            gap: 10px;
            overflow-x: auto;
            padding: 4px 0 10px;
            scrollbar-width: thin;
        }

        .week-strip::-webkit-scrollbar {
            height: 8px;
        }

        .week-strip::-webkit-scrollbar-thumb {
            border-radius: 999px;
            background: color-mix(in srgb, var(--primary) 40%, var(--line));
        }

        .week-button {
            min-height: 74px;
            padding: 10px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: color-mix(in srgb, var(--surface-soft) 82%, var(--surface));
            cursor: pointer;
            text-align: start;
            transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
        }

        .week-button:hover {
            transform: translateY(-1px);
            border-color: var(--primary);
        }

        .week-button.active {
            border-color: var(--primary);
            background:
                linear-gradient(160deg, color-mix(in srgb, var(--primary-soft) 88%, transparent), transparent),
                var(--surface);
            box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--primary) 40%, transparent);
        }

        .week-button.past {
            background: linear-gradient(135deg, #0a1931, #1a3d63);
            color: #ffffff;
        }

        .week-button.past .week-number {
            text-decoration: line-through;
            text-decoration-thickness: 2px;
        }

        .week-button.current {
            border-color: var(--primary);
        }

        .week-button.future {
            background: color-mix(in srgb, var(--accent-soft) 72%, var(--surface));
        }

        .week-number {
            display: block;
            font-size: 15px;
            font-weight: 900;
            white-space: nowrap;
        }

        .week-mini-date {
            display: block;
            margin-top: 6px;
            color: currentColor;
            font-size: 12px;
            opacity: 0.78;
            white-space: nowrap;
        }

        .workspace {
            display: grid;
            grid-template-columns: 270px minmax(0, 1fr);
            min-height: 580px;
            background: color-mix(in srgb, var(--surface) 88%, var(--surface-soft));
        }

        .phase-panel {
            border-inline-end: 1px solid var(--line);
            background:
                linear-gradient(180deg, color-mix(in srgb, var(--surface-soft) 92%, transparent), transparent 82%),
                var(--surface-soft);
            padding: 18px;
        }

        .panel-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }

        .panel-head h2 {
            font-size: 18px;
        }

        .phase-list {
            display: grid;
            gap: 9px;
        }

        .phase-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 38px 38px;
            gap: 7px;
            align-items: center;
        }

        .phase-item {
            display: grid;
            grid-template-columns: 10px minmax(0, 1fr) auto;
            gap: 10px;
            align-items: center;
            min-height: 48px;
            padding: 0 10px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: color-mix(in srgb, var(--surface) 88%, var(--surface-soft));
            cursor: pointer;
            text-align: start;
        }

        .phase-item.active {
            border-color: var(--primary);
            background: var(--primary-soft);
        }

        .phase-color {
            width: 10px;
            height: 28px;
            border-radius: 999px;
            background: var(--phase-color, var(--primary));
        }

        .phase-name {
            overflow: hidden;
            font-weight: 900;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .phase-count {
            min-width: 26px;
            padding: 3px 7px;
            border-radius: 999px;
            background: color-mix(in srgb, var(--surface-strong) 72%, var(--surface));
            color: var(--primary-strong);
            font-size: 12px;
            font-weight: 900;
            text-align: center;
        }

        .mini-icon {
            width: 38px;
            height: 38px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: var(--surface);
            cursor: pointer;
        }

        .mini-icon:hover {
            border-color: var(--primary);
            background: var(--primary-soft);
        }

        .planner {
            min-width: 0;
            padding: 18px;
            background:
                linear-gradient(180deg, var(--surface), color-mix(in srgb, var(--surface-soft) 78%, var(--surface))),
                var(--surface);
        }

        .archive-note {
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            margin-bottom: 14px;
            padding: 12px 14px;
            border: 1px solid color-mix(in srgb, var(--archived) 45%, var(--line));
            border-radius: var(--radius);
            background: linear-gradient(135deg, #0a1931, #1a3d63);
            color: #ffffff;
            font-weight: 800;
        }

        .archive-note.show {
            display: flex;
        }

        .days-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .day-card {
            min-width: 0;
            width: 100%;
            display: grid;
            grid-template-columns: 180px 1fr;
            grid-template-rows: 1fr;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: color-mix(in srgb, var(--surface) 92%, var(--surface-soft));
            overflow: hidden;
            box-shadow: 0 4px 18px color-mix(in srgb, var(--primary) 8%, transparent);
            min-height: 120px;
        }

        .day-card.past-day {
            background: color-mix(in srgb, var(--surface) 68%, var(--archived));
        }

        .day-card.today {
            border-color: var(--primary);
            box-shadow:
                inset 0 0 0 1px color-mix(in srgb, var(--primary) 40%, transparent),
                0 18px 38px color-mix(in srgb, var(--primary) 14%, transparent);
        }

        .day-head {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 6px;
            padding: 16px 20px;
            border-inline-end: 1px solid var(--line);
            background:
                linear-gradient(135deg, color-mix(in srgb, var(--surface-soft) 88%, transparent), transparent),
                var(--surface);
        }

        .day-name {
            font-size: 16px;
            font-weight: 950;
        }

        .day-date {
            color: var(--muted);
            font-size: 12px;
            font-weight: 800;
        }

        .day-card.past-day .day-name {
            text-decoration: line-through;
            text-decoration-thickness: 2px;
        }

        .task-list {
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 10px;
            flex: 1;
            margin: 0;
            padding: 14px 16px;
            list-style: none;
            min-height: 90px;
        }

        .task-item {
            display: grid;
            grid-template-columns: 26px minmax(0, 1fr) 30px;
            gap: 8px;
            align-items: start;
            padding: 10px 12px;
            border: 1px solid var(--line);
            border-inline-start: 4px solid var(--primary);
            border-radius: var(--radius);
            background: color-mix(in srgb, var(--surface-soft) 86%, var(--surface));
            min-width: 220px;
            max-width: 380px;
            flex: 1 1 220px;
        }

        .task-item[data-priority="high"] {
            border-inline-start-color: var(--danger);
        }

        .task-item[data-priority="normal"] {
            border-inline-start-color: var(--accent);
        }

        .task-item[data-priority="low"] {
            border-inline-start-color: var(--success);
        }

        .task-item.done {
            opacity: 0.72;
        }

        .task-item.done .task-text {
            text-decoration: line-through;
            text-decoration-thickness: 2px;
        }

        .task-check {
            width: 22px;
            height: 22px;
            margin-top: 1px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .task-main {
            min-width: 0;
            padding: 0;
            border: none;
            background: transparent;
            color: inherit;
            cursor: pointer;
            text-align: start;
        }

        .task-text {
            display: block;
            overflow-wrap: anywhere;

            color: var(--danger);
            cursor: pointer;
            font-size: 18px;
            line-height: 1;

        }

            padding: 16px 12px;
            color: var(--muted);
            font-size: 13px;
            font-weight: 800;
            line-height: 1.7;
            text-align: center;
        }

        .add-task {
            min-height: 44px;
            margin: 0 16px 16px;
            border: 1px dashed var(--primary);
            border-radius: var(--radius);
            background: transparent;
            color: var(--primary-strong);
            cursor: pointer;
            font-weight: 950;
            margin-top: auto;
        }

        .add-task:hover {
            background: var(--primary-soft);
        }

        dialog {
            width: min(560px, calc(100% - 28px));
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background:
                linear-gradient(180deg, color-mix(in srgb, var(--surface) 92%, transparent), transparent),
                var(--surface-soft);
            color: var(--ink);
            box-shadow: var(--shadow);
        }

        dialog::backdrop {
            background: rgba(3, 9, 19, 0.66);
            backdrop-filter: blur(5px);
        }

        .dialog-form {
            display: grid;
            gap: 16px;
        }

        .dialog-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--line);
        }

        .dialog-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .dialog-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            padding-top: 4px;
        }

        .swatches {
            display: flex;
            flex-wrap: wrap;
            gap: 9px;
        }

        .swatch {
            position: relative;
            width: 40px;
            height: 40px;
            border-radius: var(--radius);
            cursor: pointer;
        }

        .swatch input {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }

        .swatch span {
            display: block;
            width: 100%;
            height: 100%;
            border: 2px solid transparent;
            border-radius: inherit;
            background: var(--swatch-color);
        }

        .swatch input:checked + span {
            border-color: var(--ink);
            box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--primary);
        }

        @media (max-width: 1180px) {
            .day-card {
                grid-template-columns: 140px 1fr;

        }

        @media (max-width: 900px) {
            .app-header,
            .timeline-head,
            .archive-note {
                align-items: stretch;
                flex-direction: column;
            }

            .header-actions {
                justify-content: flex-start;
            }

            .control-band {
                grid-template-columns: 1fr 1fr;
            }

            .search-field {
                grid-column: 1 / -1;
            }

            .insights {
                grid-template-columns: repeat(2, minmax(0, 1fr));

            .workspace {
                grid-template-columns: 1fr;
            }

            .phase-panel {
                border-inline-end: none;
                border-bottom: 1px solid var(--line);

            .phase-list {
                grid-template-columns: repeat(2, minmax(0, 1fr));

                grid-template-columns: 120px 1fr;

            /* ── Runtime state ────────────────────────────────────── */
            let currentUser   = null;
            let state         = null;
            let activeUserId  = null;   // user whose state is loaded; guards duplicate auth events
            let offlineMode   = false;  // true when running from the cached identity without a live session
            let taskEditor    = { dayKey: null, taskId: null };
            let phaseEditor   = { id: null };

            // Cloud sync bookkeeping: one request in flight at a time, latest snapshot always wins
            const sync = { timer: null, retryTimer: null, inFlight: false, dirty: false, retries: 0 };

            /* ── Preferences (theme/language), readable before login ─ */
            function readPrefs() {
                try { return JSON.parse(localStorage.getItem(PREFS_KEY) || "null") || {}; } catch { return {}; }
            }

            function savePrefs() {
                if (!state) return;
                try { localStorage.setItem(PREFS_KEY, JSON.stringify({ theme: state.theme, lang: state.lang })); } catch {}
            }

            function currentLabels() {
                return labels[state?.lang || readPrefs().lang || "ar"];
            }

            /* ── Overlay helpers ──────────────────────────────────── */
            function hideSplash() { dom.splash.classList.add("hidden"); }
            function showAuth()   { hideSplash(); dom.authScreen.classList.remove("hidden"); dom.appShell.style.display = "none"; }
            function hideAuth()   { dom.authScreen.classList.add("hidden"); }
            function showApp()    { hideSplash(); hideAuth(); dom.appShell.style.display = ""; }

            function toggleAuthMode(mode) {
                dom.loginForm.classList.toggle("active-form",  mode === "login");
                dom.signupForm.classList.toggle("active-form", mode === "signup");
                dom.loginError.textContent  = "";
                dom.signupError.textContent = "";
                dom.signupSuccess.textContent = "";
            }

            /* ── Auth handlers ────────────────────────────────────── */
            function authErrorMessage(error) {
                const t   = currentLabels().errors;
                const msg = String(error?.message || "").toLowerCase();
                if (msg.includes("invalid login") || msg.includes("invalid credentials")) return t.credentials;
                if (msg.includes("already")) return t.exists;
                if (msg.includes("password")) return t.weakPassword;
                if (msg.includes("fetch") || msg.includes("network") || !navigator.onLine) return t.network;
                return t.generic;
            }

            async function handleLogin(e) {
                e.preventDefault();
                const email = dom.loginEmail.value.trim();
                const pass  = dom.loginPass.value;
                dom.loginError.textContent = "";
                if (!_sb) { dom.loginError.textContent = currentLabels().errors.network; return; }
                dom.loginBtn.disabled = true;
                try {
                    const { error } = await _sb.auth.signInWithPassword({ email, password: pass });
                    if (error) dom.loginError.textContent = authErrorMessage(error);
                } catch (err) {
                    console.error("Login failed:", err);
                    dom.loginError.textContent = authErrorMessage(err);
                } finally {
                    dom.loginBtn.disabled = false;
                }
            }

            async function handleSignup(e) {
                e.preventDefault();
                const name  = dom.signupName.value.trim();
                const email = dom.signupEmail.value.trim();
                const pass  = dom.signupPass.value;
                const t     = currentLabels();
                dom.signupError.textContent   = "";
                dom.signupSuccess.textContent = "";
                if (!_sb) { dom.signupError.textContent = t.errors.network; return; }
                if (pass.length < 6) { dom.signupError.textContent = t.errors.weakPassword; return; }
                dom.signupBtn.disabled = true;
                try {
                    const { error } = await _sb.auth.signUp({ email, password: pass, options: { data: { name } } });
                    if (error) {
                        dom.signupError.textContent = authErrorMessage(error);
                    } else {
                        dom.signupSuccess.textContent = t.accountCreated;
                        setTimeout(() => toggleAuthMode("login"), 2000);
                    }
                } catch (err) {
                    console.error("Signup failed:", err);
                    dom.signupError.textContent = authErrorMessage(err);
                } finally {
                    dom.signupBtn.disabled = false;
                }
            }

            async function handleSignOut() {
                if (!confirm(currentLabels().signOutConfirm)) return;
                try {
                    // Push pending edits first; if that fails they stay cached and are pushed after the next login
                    await syncNow();
                    try { localStorage.removeItem(LAST_USER_KEY); } catch {}
                    if (_sb) await _sb.auth.signOut();
                } catch (err) {
                    console.error("Sign out failed:", err);
                }
                // Do not rely on the auth event alone: it never fires when we are offline
                leaveApp();
            }

            /* ── Sync status indicator ────────────────────────────── */
            function setSyncStatus(status) {
                const t = currentLabels().sync;
                dom.syncStatus.dataset.state = status === "local" ? "offline" : status;
                dom.syncStatus.textContent   = t[status] || "";
                dom.syncStatus.title         = t[status] || "";
            }

            function idleSyncStatus() {
                if (!_sb)                return "local";
                if (!navigator.onLine)   return "offline";
                return sync.dirty ? "pending" : "synced";
            }

            /* ── Local cache (offline-first) ──────────────────────── */
            function getCacheKey() { return `${CACHE_KEY_PREFIX}.${activeUserId || "anon"}`; }
            function getDirtyKey() { return `${getCacheKey()}.dirty`; }

            function readCache() {
                try {
                    const saved = JSON.parse(localStorage.getItem(getCacheKey()) || "null");
                    return saved && typeof saved === "object" ? saved : null;
                } catch { return null; }
            }

            function writeCache(snapshot) {
                try { localStorage.setItem(getCacheKey(), JSON.stringify(snapshot)); } catch {}
            }

            // The dirty flag survives reloads so unsynced offline edits are never overwritten by older cloud data
            function setDirty(value) {
                sync.dirty = value;
                try {
                    if (value) localStorage.setItem(getDirtyKey(), "1");
                    else localStorage.removeItem(getDirtyKey());
                } catch {}
            }

            function wasDirty() {
                try { return localStorage.getItem(getDirtyKey()) === "1"; } catch { return false; }
            }

            async function loadUserState() {
                const cached = readCache();

                // Unsynced local edits win over whatever the cloud holds
                if (cached && wasDirty()) { setDirty(true); scheduleSync(); return buildState(cached); }

                if (!_sb || !navigator.onLine || offlineMode) {
                    return cached ? buildState(cached) : buildDefaultState();
                }

                try {
                    const { data, error } = await _sb
                        .from("user_tasks")
                        .select("state_json")
                        .eq("user_id", currentUser.id)
                        .maybeSingle();
                    if (error) throw error;
                    if (data?.state_json) {
                        writeCache(data.state_json);
                        return buildState(data.state_json);
                    }
                    // No cloud row yet: keep any local data and create the row on the first sync
                    if (cached) { setDirty(true); scheduleSync(); return buildState(cached); }
                    return buildDefaultState();
                } catch (err) {
                    console.error("Cloud load failed, using cache:", err);
                    return cached ? buildState(cached) : buildDefaultState();
                }
            }

            function buildDefaultState() {
                const prefs = readPrefs();
                return {
                    lang: prefs.lang === "en" ? "en" : "ar",
                    theme: prefs.theme || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"),
                    selectedYear: todayYear,
                    selectedWeek: currentPlannerWeek,
                    activePhaseId: "study",
                    phases: [
                        { id: "study",    names: { ar: "الدراسة", en: "Study" },    color: phaseColors[0] },
                        { id: "work",     names: { ar: "العمل",   en: "Work" },     color: phaseColors[1] },
                        { id: "personal", names: { ar: "شخصي",    en: "Personal" }, color: phaseColors[2] }
                    ],
                    tasks: {},
                    filter: "all",
                    search: ""
                };
            }

            function buildState(saved) {
                const fallback = buildDefaultState();
                const merged = {
                    ...fallback,
                    ...saved,
                    phases: Array.isArray(saved.phases) && saved.phases.length ? saved.phases : fallback.phases,
                    tasks:  {}
                };
                // Normalize every task once here so reads stay allocation-free
                if (saved.tasks && typeof saved.tasks === "object") {
                    Object.entries(saved.tasks).forEach(([key, list]) => {
                        if (Array.isArray(list) && list.length) merged.tasks[key] = list.map(normalizeTask);
                    });
                }
                if (!merged.phases.some(p => p.id === merged.activePhaseId)) {
                    merged.activePhaseId = merged.phases[0].id;
                }
                merged.search = "";
                return merged;
            }

            function getStateSnapshot() {
                return {
                    lang: state.lang,
                    theme: state.theme,
                    selectedYear: state.selectedYear,
                    selectedWeek: state.selectedWeek,
                    activePhaseId: state.activePhaseId,
                    phases: state.phases,
                    tasks: state.tasks,
                    filter: state.filter
                };
            }

            /* ── Save + debounced cloud sync ──────────────────────── */
            function saveState() {
                if (!state) return;
                writeCache(getStateSnapshot());
                savePrefs();
                setDirty(true);
                setSyncStatus(idleSyncStatus());
                scheduleSync();
            }

            function scheduleSync() {
                if (!_sb) return;
                clearTimeout(sync.timer);
                sync.timer = setTimeout(syncNow, SYNC_DEBOUNCE_MS);
            }

            function scheduleRetry() {
                clearTimeout(sync.retryTimer);
                const delay = SYNC_RETRY_MS[Math.min(sync.retries, SYNC_RETRY_MS.length - 1)];
                sync.retries += 1;
                sync.retryTimer = setTimeout(syncNow, delay);
            }

            async function syncNow() {
                clearTimeout(sync.timer);
                sync.timer = null;
                if (!_sb || !currentUser || !state || !sync.dirty) return;
                if (sync.inFlight) return;               // the running request re-checks the dirty flag when it ends
                if (offlineMode || !navigator.onLine) { setSyncStatus("offline"); return; }

                sync.inFlight = true;
                sync.dirty    = false;                   // edits made while the request runs set it back to true
                setSyncStatus("syncing");
                try {
                    const { error } = await _sb.from("user_tasks").upsert(
                        { user_id: currentUser.id, state_json: getStateSnapshot() },
                        { onConflict: "user_id" }
                    );
                    if (error) throw error;
                    sync.retries = 0;
                    clearTimeout(sync.retryTimer);
                } catch (err) {
                    console.error("Cloud sync failed:", err);
                    sync.inFlight = false;
                    sync.dirty    = true;
                    setSyncStatus(navigator.onLine ? "error" : "offline");
                    scheduleRetry();
                    return;
                }
                sync.inFlight = false;

                if (sync.dirty) {                         // newer edits arrived mid-request
                    setSyncStatus("pending");
                    scheduleSync();
                } else {
                    setDirty(false);
                    setSyncStatus("synced");
                }
            }

            /* ── Session lifecycle ────────────────────────────────── */
            async function enterApp(user, { offline = false } = {}) {
                if (activeUserId === user.id && state) return;   // duplicate auth event for the same user
                activeUserId = user.id;
                currentUser  = user;
                offlineMode  = offline;
                try {
                    localStorage.setItem(LAST_USER_KEY, JSON.stringify({
                        id: user.id, email: user.email, name: user.user_metadata?.name || ""
                    }));
                } catch {}

                state = await loadUserState();
                bindEvents();
                showApp();
                render();
                setSyncStatus(idleSyncStatus());
            }

            function leaveApp() {
                clearTimeout(sync.timer);
                clearTimeout(sync.retryTimer);
                sync.inFlight = false;
                sync.dirty    = false;
                sync.retries  = 0;
                currentUser   = null;
                activeUserId  = null;
                offlineMode   = false;
                state         = null;
                showAuth();
            }

            function readLastUser() {
                try { return JSON.parse(localStorage.getItem(LAST_USER_KEY) || "null"); } catch { return null; }
            }

            // Leave offline mode once a real session is available again
            async function recoverSession() {
                if (!_sb || !offlineMode) return;
                try {
                    const { data: { session } } = await _sb.auth.getSession();
                    if (session?.user && session.user.id === activeUserId) {
                        currentUser = session.user;
                        offlineMode = false;
                    }
                } catch (err) {
                    console.error("Session recovery failed:", err);
                }
            }

            /* ── App boot ─────────────────────────────────────────── */
            const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

            async function restoreSession() {
                let session = null;
                if (_sb) {
                    try {
                        const result = await _sb.auth.getSession();
                        session = result.data.session;
                    } catch (err) {
                        console.error("Session restore failed:", err);
                    }
                }
                if (session?.user) return enterApp(session.user);

                // Offline launch: reuse the last known identity so the cached planner stays usable
                const last = readLastUser();
                if (last?.id && (!_sb || !navigator.onLine)) {
                    return enterApp({ id: last.id, email: last.email, user_metadata: { name: last.name } }, { offline: true });
                }
                showAuth();
            }

            window.addEventListener("DOMContentLoaded", async () => {
                // Keep the splash visible briefly while the session restores in parallel
                try {
                    await Promise.all([sleep(900), restoreSession()]);
                } catch (err) {
                    console.error("Boot error:", err);
                    showAuth();
                }
                hideSplash();
                registerServiceWorker();
            });

            // Auth listener only reacts to explicit sign-in/out; session restore is handled above
            if (_sb) {
                _sb.auth.onAuthStateChange((event, session) => {
                    if (event === "SIGNED_IN" && session?.user) {
                        // SIGNED_IN also fires on tab refocus: ignore it when this user is already loaded
                        if (session.user.id === activeUserId) {
                            currentUser = session.user;
                            if (offlineMode) { offlineMode = false; syncNow(); }
                            return;
                        }
                        // Defer so we never await Supabase calls inside the auth callback
                        setTimeout(() => enterApp(session.user), 0);
                    } else if (event === "SIGNED_OUT") {
                        setTimeout(leaveApp, 0);
                    }
                });
            }

            /* ── Connectivity + lifecycle ─────────────────────────── */
            window.addEventListener("online", async () => {
                await recoverSession();
                if (state) {
                    if (sync.dirty) syncNow(); else setSyncStatus(idleSyncStatus());
                }
            });

            window.addEventListener("offline", () => { if (state) setSyncStatus("offline"); });

            document.addEventListener("visibilitychange", () => {
                if (document.visibilityState === "hidden") {
                    syncNow();                             // best-effort flush; the dirty flag covers failures
                } else {
                    refreshToday();
                }
            });

            window.addEventListener("pagehide", () => { syncNow(); });

            // Re-evaluate "today" so a planner left open past midnight rolls over
            function refreshToday() {
                const now = startOfDay(new Date());
                if (sameDay(now, today)) return;
                today              = now;
                todayYear          = getPlannerYearForDate(today);
                currentPlannerWeek = getPlannerWeekForDate(today);
                if (state) render();
            }
            setInterval(refreshToday, 60000);

            function registerServiceWorker() {
                if (!("serviceWorker" in navigator) || location.protocol === "file:") return;
                navigator.serviceWorker.register("./sw.js").catch(err => console.error("Service worker registration failed:", err));
            }

            /* ── Event bindings ───────────────────────────────────── */
            let _eventsBound = false;
            function bindEvents() {
                if (_eventsBound) return;
                _eventsBound = true;

                dom.themeToggle.addEventListener("click", () => {
                    state.theme = state.theme === "dark" ? "light" : "dark";
                    applyTheme();
                    saveState();
                });

                dom.langToggle.addEventListener("click", () => {
                    state.lang = state.lang === "ar" ? "en" : "ar";
                    saveState();
                    render();
                    setSyncStatus(idleSyncStatus());
                });

                dom.syncStatus.addEventListener("click", () => {
                    if (dom.syncStatus.dataset.state === "error") { sync.retries = 0; syncNow(); }
                });

                dom.signoutButton.addEventListener("click", handleSignOut);

                dom.yearSelect.addEventListener("change", () => {
                    state.selectedYear = Number(dom.yearSelect.value);
                    clampSelectedWeek();
                    saveState();
                    render();
                });

                dom.todayButton.addEventListener("click", goToToday);
                dom.archiveTodayButton.addEventListener("click", goToToday);

                dom.searchInput.addEventListener("input", () => {
                    state.search = dom.searchInput.value;
                    renderDays();
                });

                dom.filterSelect.addEventListener("change", () => {
                    state.filter = dom.filterSelect.value;
                    saveState();
                    renderDays();
                    renderStats();
                });

                dom.addPhaseButton.addEventListener("click", () => openPhaseDialog());
                dom.closeTaskDialog.addEventListener("click", () => dom.taskDialog.close());
                dom.cancelTaskButton.addEventListener("click", () => dom.taskDialog.close());
                dom.closePhaseDialog.addEventListener("click", () => dom.phaseDialog.close());
                dom.cancelPhaseButton.addEventListener("click", () => dom.phaseDialog.close());

                dom.taskForm.addEventListener("submit", event => {
                    event.preventDefault();
                    saveTaskFromDialog();
                });

                dom.phaseForm.addEventListener("submit", event => {
                    event.preventDefault();
                    savePhaseFromDialog();
                });

                // Delegated handlers: one listener per container instead of one per rendered element
                dom.weekStrip.addEventListener("click", event => {
                    const button = event.target.closest("[data-week]");
                    if (!button) return;
                    state.selectedWeek = Number(button.dataset.week);
                    saveState();
                    renderTimeline();
                    renderStats();
                    renderPhases();
                    renderDays();
                });

                dom.phaseList.addEventListener("click", event => {
                    const target = event.target.closest("[data-action]");
                    if (!target) return;
                    const phaseId = target.dataset.phaseId;
                    if (target.dataset.action === "select") {
                        state.activePhaseId = phaseId;
                        saveState();
                        renderPhases();
                        renderStats();
                        renderDays();
                    } else if (target.dataset.action === "edit") {
                        openPhaseDialog(phaseId);
                    } else if (target.dataset.action === "delete") {
                        deletePhase(phaseId);
                    }
                });

                dom.daysContainer.addEventListener("click", event => {
                    const target = event.target.closest("[data-action]");
                    if (!target) return;
                    const { action, dayKey, taskId } = target.dataset;
                    if (action === "open")   openTaskDialog(dayKey, taskId);
                    if (action === "add")    openTaskDialog(dayKey);
                    if (action === "delete") deleteTask(dayKey, taskId);
                });

                dom.daysContainer.addEventListener("change", event => {
                    const target = event.target.closest('[data-action="toggle"]');
                    if (target) toggleTask(target.dataset.dayKey, target.dataset.taskId);
                });
            }

            /* Auth form bindings (always active) */
            dom.loginForm.addEventListener("submit", handleLogin);
            dom.signupForm.addEventListener("submit", handleSignup);
            dom.goSignup.addEventListener("click", () => toggleAuthMode("signup"));
            dom.goLogin.addEventListener("click",  () => toggleAuthMode("login"));

            /* ── Render ───────────────────────────────────────────── */
            function render() {
                applyTheme();
                applyLanguage();
                renderAccount();
                populateYears();
                populateFilter();
                populatePriorities();
                populateSwatches();
                clampSelectedWeek();
                renderTimeline();
                renderPhases();
                renderStats();
                renderDays();
            }

            function applyTheme() {
                dom.root.dataset.theme = state.theme;
                dom.themeToggle.textContent = state.theme === "dark" ? "☀" : "☾";
                document.querySelector('meta[name="theme-color"]')
                    ?.setAttribute("content", state.theme === "dark" ? "#030913" : "#f6fafd");
                savePrefs();
            }

            function applyLanguage() {
                const t = labels[state.lang];
                dom.root.lang = state.lang;
                dom.root.dir  = state.lang === "ar" ? "rtl" : "ltr";
                document.title = t.appTitle;
                savePrefs();
                dom.todayLine.textContent = `${t.todayPrefix}: ${formatDate(today, { weekday: "long", year: "numeric", month: "long", day: "numeric" })}`;
                dom.appTitle.textContent    = t.appTitle;
                dom.appSubtitle.textContent = t.subtitle;
                dom.signoutButton.setAttribute("aria-label", state.lang === "ar" ? "تسجيل الخروج" : "Sign out");
                dom.langToggle.textContent  = state.lang === "ar" ? "EN" : "عربي";
                dom.yearLabel.textContent   = t.year;
                dom.jumpLabel.textContent   = t.jump;
                dom.todayButton.textContent = t.goToday;
                dom.archiveTodayButton.textContent = t.goToday;
                dom.searchLabel.textContent = t.search;
                dom.searchInput.placeholder = t.searchPlaceholder;
                dom.filterLabel.textContent = t.filter;
                dom.metricTotalLabel.textContent    = t.total;
                dom.metricDoneLabel.textContent     = t.done;
                dom.metricLeftLabel.textContent     = t.left;
                dom.metricProgressLabel.textContent = t.progress;
                dom.phasesTitle.textContent = t.phases;
                dom.archiveNoteText.textContent = t.archiveNote;
                dom.taskTextLabel.textContent     = t.taskText;
                dom.taskPriorityLabel.textContent = t.taskPriority;
                dom.taskTimeLabel.textContent     = t.taskTime;
                dom.cancelTaskButton.textContent  = t.cancel;
                dom.saveTaskButton.textContent    = t.save;
                dom.phaseNameLabel.textContent    = t.phaseName;
                dom.phaseColorLabel.textContent   = t.phaseColor;
                dom.cancelPhaseButton.textContent = t.cancel;
                dom.savePhaseButton.textContent   = t.save;
            }

            function renderAccount() {
                const name = currentUser?.user_metadata?.name
                    || currentUser?.email?.split("@")[0]
                    || labels[state.lang].localUser;
                dom.accountName.textContent   = name;
                dom.accountAvatar.textContent = name.trim().slice(0, 1).toUpperCase();
                dom.accountButton.title = name;
            }

            function populateYears() {
                const previousValue = String(state.selectedYear);
                dom.yearSelect.innerHTML = "";
                for (let year = todayYear - 25; year <= todayYear + 15; year += 1) {
                    const option = document.createElement("option");
                    const status = getYearStatus(year);
                    option.value    = String(year);
                    option.textContent = `${year} · ${yearStatusLabel(status)}`;
                    option.dataset.status = status;
                    option.selected = String(year) === previousValue;
                    dom.yearSelect.appendChild(option);
                }
                dom.yearSelect.dataset.status = getYearStatus(state.selectedYear);
            }

            function populateFilter() {
                const t = labels[state.lang];
                const options = ["all", "active", "done", "high"];
                dom.filterSelect.innerHTML = options.map(value =>
                    `<option value="${value}">${t.filters[value]}</option>`
                ).join("");
                dom.filterSelect.value = state.filter || "all";
            }

            function populatePriorities() {
                const t = labels[state.lang];
                dom.taskPriority.innerHTML = ["low", "normal", "high"]
                    .map(value => `<option value="${value}">${t.priorities[value]}</option>`)
                    .join("");
            }

            function populateSwatches() {
                dom.phaseSwatches.innerHTML = phaseColors.map((color, index) => `
                    <label class="swatch" style="--swatch-color: ${color}">
                        <input type="radio" name="phase-color" value="${color}" ${index === 0 ? "checked" : ""}>
                        <span></span>
                    </label>
                `).join("");
            }

            function renderTimeline() {
                const t      = labels[state.lang];
                const status = getWeekStatus(state.selectedYear, state.selectedWeek);
                const range  = getWeekRange(state.selectedYear, state.selectedWeek);
                const weeks  = weeksInPlannerYear(state.selectedYear);

                dom.weekTitle.textContent  = `${t.week} ${state.selectedWeek}`;
                dom.weekRange.textContent  = `${formatDate(range.start, { month: "short", day: "numeric" })} - ${formatDate(range.end, { month: "short", day: "numeric", year: "numeric" })}`;
                dom.weekStatus.textContent = statusLabel(status);
                dom.weekStatus.className   = `status-pill ${status}`;
                dom.archiveNote.classList.toggle("show", status === "past" || getYearStatus(state.selectedYear) === "past");

                // Built as one string and inserted once; clicks are handled by a delegated listener
                const buttons = [];
                for (let week = 1; week <= weeks; week += 1) {
                    const weekStatus = getWeekStatus(state.selectedYear, week);
                    const weekRange  = getWeekRange(state.selectedYear, week);
                    const isActive   = week === state.selectedWeek;
                    buttons.push(`
                        <button type="button" class="week-button ${weekStatus} ${isActive ? "active" : ""}"
                                data-week="${week}" aria-pressed="${isActive}">
                            <span class="week-number">${t.week} ${week}</span>
                            <span class="week-mini-date">${formatDate(weekRange.start, { month: "short", day: "numeric" })}</span>
                        </button>`);
                }
                dom.weekStrip.innerHTML = buttons.join("");

                requestAnimationFrame(() => {
                    const active = dom.weekStrip.querySelector(".week-button.active");
                    if (active) active.scrollIntoView({ inline: "center", block: "nearest" });
                });
            }

            function renderPhases() {
                const t = labels[state.lang];
                dom.phaseList.innerHTML = state.phases.map(phase => {
                    const id = escapeHtml(phase.id);
                    return `
                        <div class="phase-row">
                            <button type="button" class="phase-item ${phase.id === state.activePhaseId ? "active" : ""}"
                                    style="--phase-color: ${escapeHtml(phase.color || phaseColors[0])}"
                                    data-action="select" data-phase-id="${id}">
                                <span class="phase-color" aria-hidden="true"></span>
                                <span class="phase-name">${escapeHtml(getPhaseName(phase))}</span>
                                <span class="phase-count">${countTasksForPhase(phase.id)}</span>
                            </button>
                            <button type="button" class="mini-icon" data-action="edit" data-phase-id="${id}" aria-label="${t.edit}">✎</button>
                            <button type="button" class="mini-icon" data-action="delete" data-phase-id="${id}" aria-label="${t.delete}">×</button>
                        </div>`;
                }).join("");
            }

            function renderStats() {
                const tasks    = getWeekTasks(state.activePhaseId);
                const filtered = tasks.filter(task => taskMatches(task, ""));
                const done     = filtered.filter(task => task.done).length;
                const total    = filtered.length;
                const left     = total - done;
                const pct      = total ? Math.round((done / total) * 100) : 0;

                dom.metricTotal.textContent    = total;
                dom.metricDone.textContent     = done;
                dom.metricLeft.textContent     = left;
                dom.metricProgress.textContent = `${pct}%`;
                dom.progressFill.style.width   = `${pct}%`;
            }

            function renderTask(task, dayKey, t) {
                const dayAttr = escapeHtml(dayKey);
                const idAttr  = escapeHtml(task.id);
                const chips = [];
                if (task.time) chips.push(`<span class="meta-chip">${escapeHtml(task.time)}</span>`);
                if (task.priority && task.priority !== "normal") {
                    chips.push(`<span class="meta-chip">${escapeHtml(t.priorities[task.priority] || task.priority)}</span>`);
                }
                return `
                    <li class="task-item ${task.done ? "done" : ""}" data-priority="${escapeHtml(task.priority || "normal")}">
                        <input type="checkbox" class="task-check" ${task.done ? "checked" : ""}
                               aria-label="${escapeHtml(task.text)}"
                               data-action="toggle" data-day-key="${dayAttr}" data-task-id="${idAttr}">
                        <button type="button" class="task-main" data-action="open" data-day-key="${dayAttr}" data-task-id="${idAttr}">
                            <span class="task-text">${escapeHtml(task.text)}</span>
                            <div class="task-meta">${chips.join("")}</div>
                        </button>
                        <button type="button" class="delete-task" data-action="delete" data-day-key="${dayAttr}"
                                data-task-id="${idAttr}" aria-label="${t.delete}">×</button>
                    </li>`;
            }

            function renderDays() {
                const t     = labels[state.lang];
                const range = getWeekRange(state.selectedYear, state.selectedWeek);
                const query = normalizeText(state.search);
                const cards = [];

                for (let dayIndex = 0; dayIndex < 7; dayIndex += 1) {
                    const dayDate = addDays(range.start, dayIndex);
                    const isToday = sameDay(dayDate, today);
                    const isPast  = dayDate < today && !isToday;
                    const dayKey  = getDayKey(dayIndex);
                    const tasks   = getTasks(dayKey).filter(task => taskMatches(task, query));

                    const items = tasks.length
                        ? tasks.map(task => renderTask(task, dayKey, t)).join("")
                        : `<li class="empty-state">${query ? t.emptyFiltered : t.empty}</li>`;

                    cards.push(`
                        <div class="day-card ${isPast ? "past-day" : ""} ${isToday ? "today" : ""}">
                            <div class="day-head">
                                <span class="day-name">${t.days[dayIndex]}</span>
                                <span class="day-date">${formatDate(dayDate, { month: "short", day: "numeric" })}</span>
                            </div>
                            <div style="display:flex;flex-direction:column;flex:1;min-width:0">
                                <ul class="task-list">${items}</ul>
                                <button type="button" class="add-task" data-action="add" data-day-key="${escapeHtml(dayKey)}">${t.addTask}</button>
                            </div>
                        </div>`);
                }
                dom.daysContainer.innerHTML = cards.join("");
            }

            /* ── Task CRUD ────────────────────────────────────────── */
            function openTaskDialog(dayKey, taskId = null) {
                const t    = labels[state.lang];
                taskEditor = { dayKey, taskId };
                const task = taskId ? findTask(dayKey, taskId) : null;
                dom.taskDialogTitle.textContent = task ? t.taskTitleEdit : t.taskTitleNew;
                dom.taskText.value     = task ? task.text : "";
                dom.taskPriority.value = task ? task.priority || "normal" : "normal";
                dom.taskTime.value     = task ? task.time || "" : "";
                dom.taskDialog.showModal();
                setTimeout(() => dom.taskText.focus(), 0);
            }

            function saveTaskFromDialog() {
                const text = dom.taskText.value.trim();
                if (!text) return;
                const list = ensureTaskList(taskEditor.dayKey);
                if (taskEditor.taskId) {
                    const task = findTask(taskEditor.dayKey, taskEditor.taskId);
                    if (task) {
                        task.text     = text;
                        task.priority = dom.taskPriority.value;
                        task.time     = dom.taskTime.value;
                    }
                } else {
                    list.push({
                        id:        createId("task"),
                        text,
                        done:      false,
                        priority:  dom.taskPriority.value,
                        time:      dom.taskTime.value,
                        createdAt: new Date().toISOString()
                    });
                }
                dom.taskDialog.close();
                saveState();
                renderStats();
                renderPhases();
                renderDays();
            }

            function toggleTask(dayKey, taskId) {
                const task = findTask(dayKey, taskId);
                if (!task) return;
                task.done = !task.done;
                saveState();
                renderStats();
                renderPhases();
                renderDays();
            }

            function deleteTask(dayKey, taskId) {
                if (!confirm(labels[state.lang].deleteTaskConfirm)) return;
                const list = ensureTaskList(dayKey);
                state.tasks[dayKey] = list.filter(task => task.id !== taskId);
                saveState();
                renderStats();
                renderPhases();
                renderDays();
            }

            /* ── Phase CRUD ───────────────────────────────────────── */
            function openPhaseDialog(phaseId = null) {
                const t     = labels[state.lang];
                const phase = phaseId ? state.phases.find(item => item.id === phaseId) : null;
                phaseEditor.id = phaseId;
                dom.phaseDialogTitle.textContent = phase ? t.phaseTitleEdit : t.phaseTitleNew;
                dom.phaseName.value = phase ? getPhaseName(phase) : "";
                const color = phase ? phase.color || phaseColors[0] : phaseColors[0];
                dom.phaseSwatches.querySelectorAll("input").forEach(input => {
                    input.checked = input.value === color;
                });
                dom.phaseDialog.showModal();
                setTimeout(() => dom.phaseName.focus(), 0);
            }

            function savePhaseFromDialog() {
                const name = dom.phaseName.value.trim();
                if (!name) return;
                const colorInput = dom.phaseSwatches.querySelector("input:checked");
                const color      = colorInput ? colorInput.value : phaseColors[0];
                if (phaseEditor.id) {
                    const phase = state.phases.find(item => item.id === phaseEditor.id);
                    if (phase) { phase.name = name; delete phase.names; phase.color = color; }
                } else {
                    const id = createId("phase");
                    state.phases.push({ id, name, color });
                    state.activePhaseId = id;
                }
                dom.phaseDialog.close();
                saveState();
                renderPhases();
                renderStats();
                renderDays();
            }

            function deletePhase(phaseId) {
                const t = labels[state.lang];
                if (state.phases.length === 1) { alert(t.lastPhaseWarning); return; }
                if (!confirm(t.deletePhaseConfirm)) return;
                state.phases = state.phases.filter(phase => phase.id !== phaseId);
                // Keys look like "2026-W05-<phaseId>-D3"; match the phase segment exactly
                Object.keys(state.tasks).forEach(key => {
                    const match = /^\d+-W\d+-(.+)-D[0-6]$/.exec(key);
                    if (match && match[1] === phaseId) delete state.tasks[key];
                });
                if (state.activePhaseId === phaseId) state.activePhaseId = state.phases[0].id;
                saveState();
                renderPhases();
                renderStats();
                renderDays();
            }

            /* ── Navigation ───────────────────────────────────────── */
            function goToToday() {
                state.selectedYear = todayYear;
                state.selectedWeek = currentPlannerWeek;
                saveState();
                render();
            }

            /* ── Task helpers ─────────────────────────────────────── */
            function getWeekTasks(phaseId) {
                const tasks = [];
                for (let dayIndex = 0; dayIndex < 7; dayIndex += 1) {
                    tasks.push(...getTasks(getDayKey(dayIndex, phaseId)));
                }
                return tasks;
            }

            function countTasksForPhase(phaseId) { return getWeekTasks(phaseId).length; }

            function getTasks(dayKey) {
                return state.tasks[dayKey] || [];
            }

            function ensureTaskList(dayKey) {
                if (!state.tasks[dayKey]) state.tasks[dayKey] = [];
                return state.tasks[dayKey];
            }

            function normalizeTask(task) {
                if (typeof task === "string") {
                    return { id: createId("task"), text: task, done: false, priority: "normal", time: "", createdAt: new Date().toISOString() };
                }
                return {
                    id:        task.id || createId("task"),
                    text:      task.text || "",
                    done:      Boolean(task.done),
                    priority:  task.priority || "normal",
                    time:      task.time || "",
                    createdAt: task.createdAt || new Date().toISOString()
                };
            }

            function findTask(dayKey, taskId) {
                return ensureTaskList(dayKey).find(task => task.id === taskId);
            }

            function taskMatches(task, query) {
                if (state.filter === "active" && task.done) return false;
                if (state.filter === "done"   && !task.done) return false;
                if (state.filter === "high"   && task.priority !== "high") return false;
                if (!query) return true;
                return normalizeText(task.text).includes(query);
            }

            function getDayKey(dayIndex, phaseId = state.activePhaseId) {
                return `${state.selectedYear}-W${String(state.selectedWeek).padStart(2, "0")}-${phaseId}-D${dayIndex}`;
            }

            function getPhaseName(phase) {
                if (phase.names && phase.names[state.lang]) return phase.names[state.lang];
                return phase.name || phase.id;
            }

            /* ── Date / week helpers ──────────────────────────────── */
            function clampSelectedWeek() {
                const weeks = weeksInPlannerYear(state.selectedYear);
                state.selectedWeek = Math.min(Math.max(Number(state.selectedWeek) || 1, 1), weeks);
            }

            function getYearStatus(year) {
                if (year < todayYear) return "past";
                if (year > todayYear) return "future";
                return "current";
            }

            function getWeekStatus(year, week) {
                const yearStatus = getYearStatus(year);
                if (yearStatus === "past")   return "past";
                if (yearStatus === "future") return "future";
                const range = getWeekRange(year, week);
                if (range.end < today)   return "past";
                if (range.start > today) return "future";
                return "current";
            }

            function yearStatusLabel(status) {
                const t = labels[state.lang];
                return status === "past" ? t.pastYear : status === "future" ? t.futureYear : t.currentYear;
            }

            function statusLabel(status) {
                const t = labels[state.lang];
                return status === "past" ? t.past : status === "future" ? t.future : t.current;
            }

            // Planner years start on the Saturday on/before Jan 1, so late-December days can belong to the next year
            function getPlannerYearForDate(date) {
                const year = date.getFullYear();
                return startOfDay(date) >= plannerYearStart(year + 1) ? year + 1 : year;
            }

            function getPlannerWeekForDate(date) {
                const year = getPlannerYearForDate(date);
                const diff = daysBetween(plannerYearStart(year), date);
                return Math.min(Math.floor(diff / 7) + 1, weeksInPlannerYear(year));
            }

            // 52 or 53 weeks depending on where the next year's first Saturday falls
            function weeksInPlannerYear(year) {
                return daysBetween(plannerYearStart(year), plannerYearStart(year + 1)) / 7;
            }

            // Whole calendar days between two dates, immune to DST shifts
            function daysBetween(from, to) {
                const utc = d => Date.UTC(d.getFullYear(), d.getMonth(), d.getDate());
                return Math.round((utc(to) - utc(from)) / DAY_MS);
            }

            function plannerYearStart(year) {
                const janOne          = new Date(year, 0, 1);
                const offsetFromSaturday = (janOne.getDay() + 1) % 7;
                return startOfDay(new Date(year, 0, 1 - offsetFromSaturday));
            }

            function getWeekRange(year, week) {
                const start = addDays(plannerYearStart(year), (week - 1) * 7);
                return { start, end: addDays(start, 6) };
            }

            function addDays(date, days) {
                const next = new Date(date);
                next.setDate(next.getDate() + days);
                return startOfDay(next);
            }

            function startOfDay(date) {
                const next = new Date(date);
                next.setHours(0, 0, 0, 0);
                return next;
            }

            function sameDay(first, second) {
                return first.getFullYear() === second.getFullYear()
                    && first.getMonth()    === second.getMonth()
                    && first.getDate()     === second.getDate();
            }

            function formatDate(date, options) {
                const locale = state?.lang === "ar" ? "ar-SA-u-ca-gregory" : "en-US";
                return new Intl.DateTimeFormat(locale, options).format(date);
            }

            function createId(prefix) {
                return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
            }

            function normalizeText(value) {
                return String(value || "").trim().toLowerCase();
            }

            function escapeHtml(value) {
                return String(value)
                    .replaceAll("&", "&amp;")
                    .replaceAll("<", "&lt;")
                    .replaceAll(">", "&gt;")
                    .replaceAll('"', "&quot;")
                    .replaceAll("'", "&#039;");
            }

        })();
    </script>
</body>
</html>
